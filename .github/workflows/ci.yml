name: CI

# The fork's only automated check. Runs on every push/PR to develop and main,
# and is invoked as a reusable workflow by deploy-api.yml / deploy-dashboard.yml
# / deploy-worker.yml so no image is built and deployed without it passing.
#
# This job used to live in docker-build.yml, which became workflow_dispatch-only
# when this fork stopped publishing to Docker Hub — taking the fork's only CI
# with it. It lives here now, and only here.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_call:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:26.1.3.52
        ports:
          - 8123:8123
        env:
          CLICKHOUSE_DB: openpanel
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ""
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # .nvmrc is the source of truth; keep ARG NODE_VERSION in
          # apps/*/Dockerfile in sync with it. Must stay >=22.19.0:
          # undici@8 fails at import on older Node with
          # "webidl.util.markAsUncloneable is not a function".
          node-version-file: ".nvmrc"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Codegen
        run: pnpm codegen

      - name: Migrate database
        run: pnpm migrate:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
          DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
          CLICKHOUSE_URL: http://localhost:8123/openpanel
          SELF_HOSTED: "true"

      - name: Run tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
          CLICKHOUSE_URL: http://localhost:8123/openpanel
          REDIS_URL: redis://localhost:6379

      # - name: Run Biome
      #   run: pnpm lint

      # - name: Run TypeScript checks
      #   run: pnpm typecheck
